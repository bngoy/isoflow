[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sphinx-isoflow"
version = "0.1.0"
description = "Sphinx extension for embedding interactive Isoflow diagrams"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = ["sphinx>=4.0"]

[tool.setuptools.package-data]
sphinx_isoflow = ["static/*"]
